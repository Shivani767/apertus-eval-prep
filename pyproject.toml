[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-eval-prep"
version = "0.1.0"
description = "Frozen-prompt eval + serving harness: same template, HF generate vs vLLM, scores on disk."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Shivani Bhandari", email = "Shivani215143@gmail.com"}]
keywords = ["llm", "evaluation", "vllm", "chat-template", "inference"]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["vllm>=0.6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
apertus-eval-prep = "apertus_eval_prep.cli:main"

[project.urls]
Homepage = "https://github.com/Shivani767/apertus-eval-prep"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
