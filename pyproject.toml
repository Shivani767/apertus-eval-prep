[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-eval-prep"
version = "0.3.0"
description = "Frozen-prompt eval harness: multi-model benchmarks, thinking/quant/safety OFAT, auto reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Shivani Bhandari", email = "Shivani215143@gmail.com"}]
keywords = ["llm", "evaluation", "vllm", "chat-template", "inference", "benchmarks"]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["vllm>=0.6.0", "bitsandbytes>=0.43"]
viz = ["matplotlib>=3.8"]
snapshot = ["datasets>=2.20", "huggingface_hub>=0.24"]
dev = ["pytest>=8.0"]

[project.scripts]
apertus-eval-prep = "apertus_eval_prep.cli:main"

[project.urls]
Homepage = "https://github.com/Shivani767/apertus-eval-prep"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
