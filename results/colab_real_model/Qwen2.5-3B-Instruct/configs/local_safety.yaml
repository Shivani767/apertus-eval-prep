name: sarvam-application-local-safety
adapter:
  kind: local_transformers
  name: local-real-model-safety
  model_id: Qwen/Qwen2.5-3B-Instruct
  revision: main
  params:
    tokenizer_id: Qwen/Qwen2.5-3B-Instruct
    tokenizer_revision: main
    device: cuda
    dtype: float16
    quantization: none
    trust_remote_code: false
    max_new_tokens: 128
    temperature: 0.0
    top_p: 1.0
    do_sample: false
    timeout_s: 600
    seed: 41
task:
  kind: static_qa
  path: data/platform_phase4_safety.jsonl
  limit: 11
prompt:
  prompt_id: sarvam-safety
  version: v1
  template: base
decoding:
  seed: 11
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 128
runtime:
  device: cuda
  precision: float16
  quantization: none
  timeout_s: 600
evaluators:
  quality: false
  safety: true
  safety_cases_path: data/platform_phase4_safety.jsonl
  safety_taxonomy_path: configs/safety_taxonomy_phase4.yaml
  groundedness: false
  tool_use: false
  cost_latency: true
metrics:
  n_boot: 200
  alpha: 0.05
  seed: 41
  practical_effect_threshold: 0.02
  min_sample_size: 10
cost:
  input_per_million: null
  output_per_million: null
  currency: USD
  source: manual_config
  effective_date: null
  estimate_label: DERIVED_ESTIMATE
evidence:
  mode: LOCAL_REAL_MODEL
  runtime_environment: google_colab
  real_model_execution: true
  external_provider_execution: false
  hardware_measured: true
  human_reviewed: false
  pricing_source: manual_config
  known_limitations:
  - Sanitized safety fixtures are not a complete safety evaluation
  - No production safety certification is implied
  - Results apply only to the recorded model and runtime
reporting:
  output_dir: runs/phase8_real_colab/local_safety
  markdown: true
  html: true
release_gates:
  path: configs/studies/phase8_sarvam_application_study/study_release_gates.yaml
evidence_class: MEASURED
