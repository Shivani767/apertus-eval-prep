# Edit MODEL_ID, MODEL_REVISION, DEVICE, DTYPE, QUANTIZATION, and optional prices.
# This template intentionally contains no credentials or provider endpoint.
name: colab-local-real-model-smoke
adapter:
  kind: local_transformers
  name: local-real-model
  model_id: YOUR_MODEL_ID
  revision: OPTIONAL_PINNED_REVISION
  params:
    tokenizer_id: YOUR_MODEL_ID
    tokenizer_revision: OPTIONAL_PINNED_REVISION
    device: auto
    dtype: auto
    quantization: none
    trust_remote_code: false
    max_new_tokens: 16
    temperature: 0.0
    top_p: 1.0
    do_sample: false
    timeout_s: 120
    seed: 7
task:
  kind: static_qa
  path: data/platform_smoke.jsonl
  tasks: [platform_qa]
  limit: 4
prompt: {prompt_id: colab-smoke, version: v1, template: base}
decoding: {seed: 7, temperature: 0.0, top_p: 1.0, max_new_tokens: 16}
runtime: {device: auto, precision: auto, quantization: none}
evaluators: {quality: true, groundedness: false, safety: false, tool_use: false}
metrics: {n_boot: 80, seed: 7}
cost:
  input_per_million: null
  output_per_million: null
  currency: USD
  source: manual_config
  effective_date: null
  estimate_label: DERIVED_ESTIMATE
evidence:
  mode: LOCAL_REAL_MODEL
  runtime_environment: google_colab
  real_model_execution: true
  external_provider_execution: false
  hardware_measured: true
  human_reviewed: false
  pricing_source: manual_config
  known_limitations:
    - Experimental environment; not production infrastructure
    - Latency is client-side wall-clock measurement
    - Results apply only to the recorded model revision and configuration
reporting: {output_dir: runs/colab-real-smoke, markdown: true, html: true}
