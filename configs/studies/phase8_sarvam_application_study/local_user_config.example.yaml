# Safe-to-commit private baseline template.
# Copy this file to local_user_config.yaml in the same directory and edit the
# placeholders there. The private copy is ignored by git. Do not put tokens,
# credentials, downloaded weights, or private datasets in either file.
model:
  id: YOUR_MODEL_ID
  revision: OPTIONAL_PINNED_REVISION
  tokenizer_id: OPTIONAL_TOKENIZER_ID

name: sarvam-application-local-user-baseline
adapter:
  kind: local_transformers
  name: local-real-model-user
  model_id: YOUR_MODEL_ID
  revision: OPTIONAL_PINNED_REVISION
  params:
    tokenizer_id: OPTIONAL_TOKENIZER_ID
    tokenizer_revision: OPTIONAL_PINNED_REVISION
    trust_remote_code: false
    device: cuda
    dtype: float16
    quantization: none
    max_new_tokens: 256
    temperature: 0.0
    top_p: 1.0
    do_sample: false
    timeout_s: 600

task:
  kind: static_qa
  path: data/eval_set.jsonl
  tasks: [arc_easy, gsm8k, hallucination, robustness, safety_bias, template_canary]
  limit: 4
  split: null
prompt: {prompt_id: sarvam-core, version: v1, template: base}
decoding: {seed: 11, temperature: 0.0, top_p: 1.0, max_new_tokens: 256}
runtime:
  device: cuda
  precision: float16
  quantization: none
  batch_size: 1
  timeout_s: 600
evaluators: {quality: true, groundedness: true, safety: false, tool_use: false, cost_latency: true}
metrics: {n_boot: 80, alpha: 0.05, seed: 11, practical_effect_threshold: 0.02, min_sample_size: 20}
cost:
  input_per_million: null
  output_per_million: null
  currency: USD
  source: manual_config
  effective_date: null
  estimate_label: DERIVED_ESTIMATE
evidence:
  mode: LOCAL_REAL_MODEL
  runtime_environment: google_colab
  real_model_execution: true
  external_provider_execution: false
  hardware_measured: true
  human_reviewed: false
  pricing_source: manual_config
  known_limitations:
    - Experimental Colab environment; not production infrastructure
    - Latency is client-side wall-clock measurement
    - Results apply only to the recorded model revision and configuration
reporting:
  output_dir: runs/phase8_real_colab/local_baseline
  markdown: true
  html: true
  include_raw_outputs: true
  pii_redaction: true
release_gates: {path: configs/studies/phase8_sarvam_application_study/study_release_gates.yaml}
evidence_class: MEASURED
