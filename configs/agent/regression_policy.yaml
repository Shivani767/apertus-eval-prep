# Regression policy: thresholds in data, never in code.
#
# `minimum_delta` is the worst acceptable signed change. Latency and token
# counts go UP when a candidate regresses, so give those a positive budget;
# quality metrics go DOWN, so give those a negative one.
#
# A gated metric that neither run reported is INCONCLUSIVE, never a pass: a
# missing metric must not be able to satisfy a gate.
regression_policy:
  task_success:
    minimum_delta: -0.02
  tool_selection:
    minimum_delta: -0.02
  tool_argument_correctness:
    minimum_delta: -0.02
  groundedness:
    minimum_delta: -0.02
  recovery:
    minimum_delta: -0.05
  latency_ms_mean:
    maximum_relative_increase: 0.20
  total_tokens_mean:
    maximum_relative_increase: 0.20
  unsafe_action_rate:
    maximum_relative_increase: 0.0
