name: Deploy Dashboard to GitHub Pages

# Quoted so YAML 1.1 parsers do not coerce the key to boolean True,
# which makes naive validators report "Expected a scalar value".
"on":
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e .

      - name: Generate dashboard data
        run: |
          PYTHONPATH=src python -m apertus_eval_prep site \
            --registry results/registry_paper.jsonl \
            --out reports/site

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  build-frontend:
    needs: generate-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy data into public folder
        run: node frontend/scripts/copy-data.mjs

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4