name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no torch needed for unit tests)
        run: pip install pyyaml pytest && pip install -e . --no-deps
      - name: Test
        run: pytest -q
